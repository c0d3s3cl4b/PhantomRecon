name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (V2 refactored surface)
        run: >-
          ruff check core/result.py modules/ip_lookup.py modules/whois_lookup.py
          modules/phone_lookup.py modules/email_osint.py modules/username_search.py
          modules/subdomain_finder.py tests
      - name: Tests
        run: pytest
      - name: CLI doctor
        run: phantomrecon doctor
