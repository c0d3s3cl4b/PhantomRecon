name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: >-
          ruff check
          cli.py
          core/builtin_providers.py
          core/config.py
          core/http.py
          core/plugins.py
          core/providers.py
          core/reporting.py
          core/result.py
          modules
          tests

      - name: Tests
        run: pytest

      - name: CLI doctor
        run: phantomrecon doctor

      - name: Provider diagnostics
        run: phantomrecon providers

      - name: Plugin diagnostics
        run: phantomrecon plugins

      - name: Config diagnostics
        run: phantomrecon config --json
