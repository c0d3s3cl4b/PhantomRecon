[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomrecon"
version = "2.2.0a1"
description = "Modular OSINT and authorized security reconnaissance framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "c0d3s3cl4b" }]
keywords = ["osint", "reconnaissance", "security", "pentest", "cybersecurity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "rich>=13.0.0",
  "requests>=2.28.0",
  "phonenumbers>=8.13.0",
  "python-whois>=0.9.0",
  "dnspython>=2.3.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
]

[project.scripts]
phantomrecon = "cli:main"

[project.urls]
Homepage = "https://github.com/c0d3s3cl4b/PhantomRecon"
Repository = "https://github.com/c0d3s3cl4b/PhantomRecon"
Issues = "https://github.com/c0d3s3cl4b/PhantomRecon/issues"

[tool.setuptools]
py-modules = ["cli", "phantomrecon"]

[tool.setuptools.packages.find]
include = ["core*", "modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
